            const w = window.open('', '_blank');
            if (w) {
                w.document.open();
                w.document.write(html);
                w.document.close();
                setTimeout(() => { w.focus(); w.print(); }, 400);
            } else {
                // المتصفح منع النافذة المنبثقة: نطبع عبر إطار مخفي
                const f = document.createElement('iframe');
                f.style.cssText = 'position:fixed;width:0;height:0;border:0;visibility:hidden;';
                document.body.appendChild(f);
                const d = f.contentWindow.document;
                d.open(); d.write(html); d.close();
                setTimeout(() => {
                    try { f.contentWindow.focus(); f.contentWindow.print(); }
                    catch (e) { showToast('تعذّر فتح نافذة الطباعة'); }
                    setTimeout(() => f.remove(), 60000);
                }, 500);
            }
        }

        // ── الأسئلة المقترحة بعد الإجابة ──
        // إن أرسل الخادم حقل followups يُستخدم، وإلا تُولَّد اقتراحات من الكلمات المفتاحية
        function suggestFollowups(answer, question) {
            const t = (answer || '') + ' ' + (question || '');
            const rules = [
                [/صيام|صوم|رمضان/, ['ما هي الشروط؟', 'ما المفطرات؟']],
                [/صلاة|صلاه|الصلا/, ['ما هي شروط الصلاة؟', 'ما هي أركان الصلاة؟']],
                [/زكاة|زكا/, ['ما هو نصاب الزكاة؟', 'من يستحق الزكاة؟']],
                [/دعاء|الدعاء/, ['ما هي آداب الدعاء؟', 'هل يوجد دليل من السنة؟']],
                [/آية|قرآن|سورة|تفسير/, ['ما تفسير هذه الآية؟', 'هل يوجد دليل من السنة؟']]
            ];
            const picked = [];
            rules.forEach(([re, arr]) => { if (re.test(t)) picked.push(...arr); });
            const generic = ['هل يوجد دليل من القرآن؟', 'هل يوجد دليل من السنة؟', 'ما قول العلماء في ذلك؟'];
            return [...new Set([...picked, ...generic])].slice(0, 3);
        }

        function clearFollowups() { document.getElementById('followups')?.remove(); }

        function showFollowups(list) {
            clearFollowups();
            if (!list || !list.length) return;
            const wrap = document.createElement('div');
            wrap.className = 'followups';
            wrap.id = 'followups';
            wrap.innerHTML = '<div class="followups-label">أسئلة مقترحة</div><div class="followups-list"></div>';
            const holder = wrap.querySelector('.followups-list');
            list.slice(0, 3).forEach(q => {
                const b = document.createElement('button');
                b.type = 'button';
                b.className = 'followup-chip';
                b.textContent = q;
                b.addEventListener('click', () => { clearFollowups(); window.askQuestion(q); });
                holder.appendChild(b);
            });
            messagesArea.appendChild(wrap);
            messagesArea.scrollTop = messagesArea.scrollHeight;
        }

        // ── تثبيت / وسم / بحث / تصفية ──
        let activeTag = '';
        const sidebarSearch = document.getElementById('sidebarSearch');
        sidebarSearch.addEventListener('input', renderConversations);

        document.getElementById('tagFilter').addEventListener('click', e => {
            const b = e.target.closest('.tag-chip');
            if (!b) return;
            activeTag = b.dataset.tag || '';
            renderConversations();
        });

        conversationList.addEventListener('click', e => {
            const item = e.target.closest('.conversation-item');
            if (!item) return;
            const chat = allChats.find(c => String(c.id) === item.dataset.id);
            if (!chat) return;
            const btn = e.target.closest('.ci-btn');
            if (btn) {
                e.stopPropagation();
                if (btn.dataset.act === 'pin') {
                    updateChatMeta(chat.id, { pinned: !chat.pinned });
                } else if (btn.dataset.act === 'tag') {
                    openTagDialog(chat);
                }
                return;
            }
            loadChat(chat.id);
            if (window.innerWidth <= 768) openSidebarMobile(false);
        });

        // ── أزرار التصدير في الإعدادات ──
        document.getElementById('exportTxtBtn').addEventListener('click', () => exportChat('txt'));
        document.getElementById('exportPdfBtn').addEventListener('click', () => exportChat('pdf'));

        // ── زر الانتقال لآخر رسالة ──
        const scrollBottomBtn = document.getElementById('scrollBottomBtn');
        function updateScrollBtn() {
            const dist = messagesArea.scrollHeight - messagesArea.scrollTop - messagesArea.clientHeight;
            scrollBottomBtn.classList.toggle('visible', dist > 160);
        }
        messagesArea.addEventListener('scroll', updateScrollBtn, { passive: true });
        scrollBottomBtn.addEventListener('click', () => {
            messagesArea.scrollTo({ top: messagesArea.scrollHeight, behavior: 'smooth' });
        });

        // ── الشريط الجانبي (للجوال) ──
        function openSidebarMobile(open) {
            sidebar.classList.toggle('active', open);
            sidebarOverlay.style.display = open ? 'block' : 'none';
        }

        // ── اختصارات لوحة المفاتيح ──
        //   Ctrl/⌘ + K      : البحث في المحادثات
        //   Alt + N         : محادثة جديدة
        //   Esc             : إغلاق القوائم والإعدادات والتأكيد والشريط الجانبي
        document.addEventListener('keydown', e => {
            const mod = e.ctrlKey || e.metaKey;
            if (mod && !e.shiftKey && e.key.toLowerCase() === 'k') {
                e.preventDefault();
                if (window.innerWidth <= 768) openSidebarMobile(true);
                sidebarSearch.focus();
                sidebarSearch.select();
                return;
            }
            if (e.altKey && !mod && e.key.toLowerCase() === 'n') {
                e.preventDefault();
                startNewChat();
                if (window.innerWidth <= 768) openSidebarMobile(false);
                messageInput.focus();
                return;
            }
            if (e.key === 'Escape') {
                if (confirmOverlay.classList.contains('active')) confirmOverlay.classList.remove('active');
                if (tagOverlay.classList.contains('active')) closeTagDialog();
                if (settingsOverlay.classList.contains('active')) closeSettings();
                if (sidebar.classList.contains('active')) openSidebarMobile(false);
                setMenuOpen(false);
            }
        });

        // ══════════════════════════════════════════════════════════════════
        // v3: أدوات مساعدة للجوال + نافذة الوسم
        // ══════════════════════════════════════════════════════════════════
        function isTouchDevice() { return !!(window.matchMedia && window.matchMedia('(pointer: coarse)').matches); }
        function focusInput() { if (!isTouchDevice()) messageInput.focus(); }
        function apiHistory() { return chatHistory.slice(-4).map(m => ({ role: m.role, content: m.content })); }
        function copyText(text) {
            if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text);
            return new Promise((resolve, reject) => {
                const ta = document.createElement('textarea');
                ta.value = text;
                ta.setAttribute('readonly', '');
                ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;font-size:16px;';
                document.body.appendChild(ta);
                ta.select();
                ta.setSelectionRange(0, text.length);
                let ok = false;
                try { ok = document.execCommand('copy'); } catch (e) {}
                ta.remove();
                ok ? resolve() : reject(new Error('copy failed'));
            });
        }

        const TAG_PRESETS = ['فقه الصيام', 'العقيدة', 'التفسير', 'الصلاة', 'الزكاة', 'السيرة'];
        const tagOverlay = document.getElementById('tagOverlay');
        const tagInput = document.getElementById('tagInput');
        const tagPresetsEl = document.getElementById('tagPresets');
        let tagTargetId = null;

        function openTagDialog(chat) {
            tagTargetId = chat.id;
            tagInput.value = chat.tag || '';
            const existing = allChats.map(c => c.tag).filter(Boolean);
            const all = [...new Set([...existing, ...TAG_PRESETS])];
            tagPresetsEl.innerHTML = all.map(t => `<button type="button" class="tag-chip" data-tag="${escHtml(t)}">${escHtml(t)}</button>`).join('');
            tagOverlay.classList.add('active');
            if (!isTouchDevice()) setTimeout(() => tagInput.focus(), 50);
        }
        function closeTagDialog() { tagOverlay.classList.remove('active'); tagTargetId = null; }
        function commitTag(value) {
            if (tagTargetId !== null) updateChatMeta(tagTargetId, { tag: String(value || '').trim().slice(0, 30) });
            closeTagDialog();
        }
        tagPresetsEl.addEventListener('click', e => {
            const b = e.target.closest('.tag-chip');
            if (b) commitTag(b.dataset.tag);
        });
        document.getElementById('tagSave').addEventListener('click', () => commitTag(tagInput.value));
        document.getElementById('tagRemove').addEventListener('click', () => commitTag(''));
        document.getElementById('tagCancel').addEventListener('click', closeTagDialog);
        tagOverlay.addEventListener('click', e => { if (e.target === tagOverlay) closeTagDialog(); });
        tagInput.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); commitTag(tagInput.value); } });

        // عند التحويل من الجوال إلى سطح المكتب (تدوير الشاشة/تغيير الحجم) نُغلق الطبقة المعتمة
        window.addEventListener('resize', () => {
            if (window.innerWidth > 768 && sidebar.classList.contains('active')) openSidebarMobile(false);
        });

        renderWelcome();

    </script>
