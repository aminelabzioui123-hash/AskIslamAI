<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes, viewport-fit=cover">
    <title>اسأل الإسلام AI - بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Amiri+Quran&display=swap" rel="stylesheet">
    <style>
        /* ========== Reset ========== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; height: 100dvh; overflow: hidden; }

        /* ========== Design Tokens (Soft Islamic Green) ========== */
        :root {
            --green-900: #1b4332;
            --green-800: #0f5132;
            --green-700: #2d6a4f;
            --green-600: #40916c;
            --green-100: #d8f3dc;
            --green-50:  #eef7f0;
            --gold: #b8934a;
            --gold-soft: #f4ead2;

            --bg-primary: #f3f4f6;
            --bg-secondary: #eceef1;
            --bg-sidebar: #ffffff;
            --bg-card: #ffffff;
            --text-primary: #1f2937;
            --text-secondary: #4b5563;
            --text-tertiary: #8a93a0;
            --accent: var(--green-800);
            --accent-hover: var(--green-900);
            --accent-soft: var(--green-50);
            --on-accent: #ffffff;
            --border: #e5e7eb;
            --border-strong: #d1d5db;
            --user-bubble: var(--green-800);
            --user-text: #ffffff;
            --quran-color: var(--green-900);
            --quote-color: #6b7280;

            --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
            --shadow-md: 0 2px 8px rgba(0,0,0,0.05);
            --shadow-lg: 0 10px 30px rgba(0,0,0,0.12);
            --shadow-input: 0 4px 24px rgba(15,81,50,0.10), 0 1px 4px rgba(0,0,0,0.06);

            --sidebar-width: 300px;
            --header-height: 0px;
            --radius: 16px;
            --radius-sm: 10px;
            --chat-font-size: 0.95rem;
        }

        /* ── DARK THEME ── */
        [data-theme="dark"] {
            --bg-primary: #0f1613;
            --bg-secondary: #1a231f;
            --bg-sidebar: #121b17;
            --bg-card: #18221d;
            --text-primary: #e8efea;
            --text-secondary: #b5c2ba;
            --text-tertiary: #7d8c83;
            --accent: #52b788;
            --accent-hover: #74c69d;
            --accent-soft: rgba(82,183,136,0.12);
            --on-accent: #0b1f15;
            --border: #26332c;
            --border-strong: #35453c;
            --user-bubble: #2d6a4f;
            --user-text: #ffffff;
            --quran-color: #95d5b2;
            --quote-color: #9fb0a6;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.4);
            --shadow-md: 0 2px 8px rgba(0,0,0,0.35);
            --shadow-lg: 0 10px 30px rgba(0,0,0,0.5);
            --shadow-input: 0 4px 24px rgba(0,0,0,0.45);
        }

        body {
            font-family: 'IBM Plex Sans Arabic', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-weight: 400;
            background: var(--bg-primary);
            color: var(--text-primary);
            display: flex;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }
        button { font-family: inherit; }

        /* ========== Sidebar ========== */
        .sidebar {
            position: fixed; top: 0; right: 0;
            width: var(--sidebar-width); height: 100vh; height: 100dvh;
            background: var(--bg-sidebar);
            border-left: 1px solid var(--border);
            box-shadow: -4px 0 24px rgba(0,0,0,0.04);
            display: flex; flex-direction: column;
            z-index: 10001; overflow: hidden;
            transition: transform .3s ease;
        }
        .sidebar-header {
            padding: 1.6rem 1rem 1.1rem;
            display: flex; flex-direction: column; align-items: center;
            flex-shrink: 0;
        }
        .sidebar-logo {
            width: 84px; height: 84px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 50%;
            background: #fff;
            padding: 6px;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border);
            flex-shrink: 0; overflow: hidden;
        }
        .sidebar-logo img { width: 100%; height: 100%; object-fit: contain; display: block; border-radius: 50%; }
        .sidebar-title { display: none; }

        .sidebar-user { padding: 0 1rem; margin-bottom: .8rem; flex-shrink: 0; }
        .user-info {
            display: flex; align-items: center; gap: .75rem;
            padding: .7rem .8rem;
            background: var(--accent-soft);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
        }
        .user-avatar {
            width: 34px; height: 34px; border-radius: 50%;
            background: var(--accent); color: var(--on-accent);
            display: flex; align-items: center; justify-content: center;
            font-weight: 600; flex-shrink: 0; overflow: hidden;
        }
        .user-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .user-details { min-width: 0; }
        .user-name { font-size: .88rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .user-email { font-size: .74rem; color: var(--text-tertiary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .new-chat-btn {
            margin: 0 1rem 1rem;
            padding: .8rem 1rem;
            background: var(--accent); color: var(--on-accent);
            border: none; border-radius: 10px;
            font-size: .95rem; font-weight: 600; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: .5rem;
            box-shadow: var(--shadow-sm);
            transition: background .2s, box-shadow .2s, transform .15s;
            flex-shrink: 0;
        }
        .new-chat-btn:hover { background: var(--accent-hover); box-shadow: 0 6px 16px rgba(15,81,50,0.25); transform: translateY(-1px); }
        .new-chat-btn svg { width: 18px; height: 18px; }

        .conversations-section { flex: 1; display: flex; flex-direction: column; min-height: 0; padding: 0 .6rem; }
        .section-title { padding: .4rem .6rem; font-size: .75rem; font-weight: 600; color: var(--text-tertiary); letter-spacing: .02em; }
        .conversation-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; padding-bottom: .5rem; }
        .conversation-list::-webkit-scrollbar { width: 5px; }
        .conversation-list::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 10px; }
        .conversation-item {
            padding: .65rem .8rem; border-radius: 10px;
            font-size: .88rem; color: var(--text-secondary);
            cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            transition: background .2s, color .2s;
        }
        .conversation-item:hover { background: rgba(15,81,50,0.06); color: var(--text-primary); }
        .conversation-item.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; box-shadow: inset -3px 0 0 var(--accent); }

        .spaces-section { display: none; }

        .sidebar-footer { padding: .7rem; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 2px; flex-shrink: 0; }
        .footer-btn {
            display: flex; align-items: center; gap: .65rem;
            padding: .6rem .8rem; background: transparent; border: none;
            border-radius: 10px; color: var(--text-secondary);
            font-size: .88rem; cursor: pointer; text-align: right; width: 100%;
            transition: background .2s, color .2s;
        }
        .footer-btn:hover { background: rgba(15,81,50,0.07); color: var(--text-primary); }
        .footer-btn svg { width: 18px; height: 18px; flex-shrink: 0; }
        .logout-btn:hover { background: rgba(190,60,60,0.08); color: #b42318; }
        .delete-all-btn:hover { background: rgba(190,60,60,0.08); color: #b42318; }

        /* ========== Confirm dialog ========== */
        .confirm-overlay {
            display: none; position: fixed; inset: 0;
            background: rgba(10,25,18,0.45); backdrop-filter: blur(3px);
            align-items: center; justify-content: center; z-index: 20000; padding: 1rem;
        }
        .confirm-overlay.active { display: flex; }
        .confirm-box {
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: 18px; padding: 1.6rem; max-width: 380px; width: 100%;
            box-shadow: var(--shadow-lg); text-align: center;
        }
        .confirm-title { font-size: 1.1rem; font-weight: 700; margin-bottom: .5rem; }
        .confirm-sub { font-size: .9rem; color: var(--text-secondary); line-height: 1.7; margin-bottom: 1.2rem; }
        .confirm-btns { display: flex; gap: .6rem; }
        .confirm-yes, .confirm-no {
            flex: 1; padding: .7rem; border-radius: 10px; font-size: .92rem; font-weight: 600; cursor: pointer;
            transition: background .2s, box-shadow .2s;
        }
        .confirm-yes { background: #c0392b; color: #fff; border: none; }
        .confirm-yes:hover { background: #a93226; box-shadow: 0 4px 12px rgba(192,57,43,.3); }
        .confirm-no { background: transparent; color: var(--text-primary); border: 1px solid var(--border-strong); }
        .confirm-no:hover { background: var(--bg-secondary); }

        /* ========== Mobile header ========== */
        .header {
            display: none; align-items: center; justify-content: space-between;
            padding: .4rem 1rem; background: var(--bg-sidebar);
            border-bottom: 1px solid var(--border); box-shadow: var(--shadow-sm);
            flex-shrink: 0; min-height: 60px;
        }
        .hamburger-btn {
            width: 42px; height: 42px; border-radius: 12px;
            background: transparent; border: none; color: var(--text-primary);
            display: flex; align-items: center; justify-content: center; cursor: pointer;
            transition: background .2s;
        }
        .hamburger-btn:hover { background: var(--bg-secondary); }
        .hamburger-btn svg { width: 24px; height: 24px; }
        .header-logo-link { display: flex; align-items: center; text-decoration: none; }
        .header-logo-img { height: 42px; width: 42px; object-fit: contain; background: #fff; border-radius: 50%; padding: 3px; border: 1px solid var(--border); }
        .header-logo-text { display: none; }
        .sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(10,25,18,0.45); backdrop-filter: blur(2px); z-index: 10000; }

        /* ========== Main ========== */
        .main-container {
            flex: 1; display: flex; flex-direction: column;
            background: var(--bg-primary);
            margin-right: var(--sidebar-width);
            min-width: 0; height: 100vh; height: 100dvh;
            overflow: hidden; position: relative;
        }
        .chat-container { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 1.2rem 1.5rem 0; }
        .messages-area {
            flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 1.3rem;
            padding: .6rem 0 1.5rem; width: 100%; max-width: 820px; margin: 0 auto;
            scroll-behavior: smooth;
        }
        .messages-area::-webkit-scrollbar { width: 6px; }
        .messages-area::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 10px; }

        /* ========== Welcome ========== */
        .welcome-section {
            margin: auto; padding: 1.5rem 0;
            display: flex; flex-direction: column; align-items: center; text-align: center; gap: 1rem;
            animation: fadeUp .5s ease;
        }
        .welcome-logo {
            width: 92px; height: 92px; border-radius: 50%;
            background: #fff; padding: 7px; border: 1px solid var(--border);
            box-shadow: var(--shadow-md); object-fit: contain;
        }
        .welcome-basmala {
            font-family: 'Amiri Quran', serif; font-size: 1.9rem; line-height: 1.9;
            color: var(--quran-color);
        }
        .welcome-title { font-size: 1.55rem; font-weight: 600; color: var(--text-primary); margin-bottom: .35rem; }
        .welcome-subtitle { font-size: .95rem; color: var(--text-secondary); line-height: 1.8; max-width: 520px; font-weight: 300; }
        .welcome-features, .prompt-cards {
            display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .75rem;
            width: 100%; max-width: 620px; margin-top: .8rem;
        }
        .prompt-card, .feature-badge {
            display: flex; align-items: center; gap: .7rem;
            padding: .9rem 1rem; text-align: right;
            background: var(--bg-card); color: var(--text-primary);
            border: 1px solid var(--border); border-radius: 14px;
            font-size: .9rem; font-weight: 500; cursor: pointer;
            box-shadow: var(--shadow-sm);
            transition: transform .2s, box-shadow .2s, border-color .2s, background .2s;
        }
        .prompt-card:hover, .feature-badge:hover {
            transform: translateY(-2px); box-shadow: 0 8px 20px rgba(15,81,50,0.12);
            border-color: var(--green-600); background: var(--accent-soft);
        }
        .prompt-card .pc-icon {
            width: 34px; height: 34px; border-radius: 10px; flex-shrink: 0;
            background: var(--gold-soft); display: flex; align-items: center; justify-content: center; font-size: 1.05rem;
        }
        [data-theme="dark"] .prompt-card .pc-icon { background: rgba(184,147,74,0.18); }

        /* ========== Messages ========== */
        .message { display: flex; gap: .7rem; align-items: flex-start; animation: fadeUp .35s ease; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .message.user { flex-direction: row; }
        .message-avatar {
            width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            background: var(--accent-soft); font-size: 1.05rem; overflow: hidden;
            border: 1px solid var(--border);
        }
        .message.assistant .message-avatar { background: #fff; padding: 3px; }
        .message.assistant .message-avatar img { width: 100%; height: 100%; object-fit: contain; border-radius: 50%; }
        .message-content {
            position: relative; max-width: min(78%, 640px);
            padding: .85rem 1.1rem; font-size: var(--chat-font-size); line-height: 1.95;
            word-wrap: break-word; overflow-wrap: anywhere;
        }
        .message.user .message-content {
            background: var(--user-bubble); color: var(--user-text);
            border-radius: 16px 16px 2px 16px;
            box-shadow: 0 2px 8px rgba(15,81,50,0.22);
        }
        .message.assistant .message-content {
            background: var(--bg-card); color: var(--text-primary);
            border: 1px solid var(--border);
            border-radius: 16px 16px 16px 2px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .quran-verse { font-family: 'Amiri Quran', serif; font-size: 1.15em; color: var(--quran-color); line-height: 2.2; }
        .quote-text { color: var(--quote-color); font-style: italic; }
        .message.user .quran-verse, .message.user .quote-text { color: inherit; }
        .sources-bar { margin-top: .8rem; padding-top: .7rem; border-top: 1px dashed var(--border-strong); font-size: .82rem; color: var(--text-secondary); }

        /* Typing */
        .typing-indicator {
            display: none; align-items: center; gap: .6rem;
            width: 100%; max-width: 820px; margin: 0 auto; padding: .4rem 1.5rem; flex-shrink: 0;
        }
        .typing-indicator.active { display: flex; }
        .typing-dots {
            display: flex; gap: 4px; padding: .5rem .8rem;
            background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow-sm);
        }
        .typing-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green-600); animation: bounce 1.2s infinite ease-in-out; }
        .typing-dot:nth-child(2) { animation-delay: .15s; }
        .typing-dot:nth-child(3) { animation-delay: .3s; }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(.6); opacity: .4; } 40% { transform: scale(1); opacity: 1; } }
        .typing-text { font-size: .82rem; color: var(--text-tertiary); }

        /* Message actions */
        .message-actions {
            display: flex; gap: .3rem; margin-top: .7rem; padding-top: .6rem;
            border-top: 1px solid var(--border);
            opacity: .55; transition: opacity .2s;
        }
        .message:hover .message-actions, .message-actions:focus-within { opacity: 1; }
        .action-btn {
            width: 32px; height: 32px; border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            background: transparent; border: 1px solid transparent; color: var(--text-tertiary);
            cursor: pointer; transition: background .2s, color .2s, border-color .2s;
        }
        .action-btn:hover { background: var(--accent-soft); color: var(--accent); border-color: var(--border); }
        .action-btn svg { width: 16px; height: 16px; }
        .action-btn.btn-copy.copied { background: var(--green-100); color: var(--green-800); }
        .action-btn.btn-like.active-like { background: var(--green-100); color: var(--green-800); }
        .action-btn.btn-dislike.active-dislike { background: #fde8e6; color: #b42318; }

        /* ========== Input (floating) ========== */
        .input-area {
            padding: .4rem 1.5rem 1.3rem; flex-shrink: 0;
            width: 100%; max-width: 820px; margin: 0 auto;
            background: transparent; position: relative;
        }
        .input-wrapper {
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: 24px; padding: .5rem .6rem .5rem .9rem;
            box-shadow: var(--shadow-input);
            transition: border-color .2s, box-shadow .2s;
            position: relative;
        }
        .input-wrapper:focus-within { border-color: var(--green-600); box-shadow: 0 6px 28px rgba(15,81,50,0.16); }
        .input-row { display: flex; align-items: flex-end; gap: .4rem; }

        .options-toggle {
            width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            background: transparent; border: none; color: var(--text-secondary); cursor: pointer;
            transition: background .2s, color .2s, transform .2s;
        }
        .options-toggle:hover, .options-toggle.open { background: var(--accent-soft); color: var(--accent); }
        .options-toggle.open { transform: rotate(45deg); }
        .options-toggle svg { width: 22px; height: 22px; }

        .options-menu {
            display: none; position: absolute; bottom: calc(100% + 10px); right: 8px;
            min-width: 230px; padding: .4rem;
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: 16px; box-shadow: var(--shadow-lg); z-index: 50;
        }
        .options-menu.active { display: block; animation: popIn .18s ease; }
        @keyframes popIn { from { opacity: 0; transform: translateY(6px) scale(.97); } to { opacity: 1; transform: translateY(0) scale(1); } }
        .option-item {
            display: flex; align-items: center; gap: .65rem; width: 100%;
            padding: .65rem .8rem; background: transparent; border: none; border-radius: 11px;
            color: var(--text-primary); font-size: .9rem; cursor: pointer; text-align: right;
            transition: background .15s, color .15s;
        }
        .option-item:hover { background: var(--bg-secondary); }
        .option-item svg { width: 18px; height: 18px; flex-shrink: 0; color: var(--text-secondary); }
        .option-item .opt-check { margin-right: auto; opacity: 0; color: var(--accent); }
        .option-item.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
        .option-item.active svg { color: var(--accent); }
        .option-item.active .opt-check { opacity: 1; }

        .message-input {
            flex: 1; min-width: 0; resize: none; border: none; outline: none; background: transparent;
            color: var(--text-primary); font-family: inherit; font-size: 1rem; line-height: 1.6;
            padding: .55rem .3rem; max-height: 100px;
        }
        .message-input::placeholder { color: var(--text-tertiary); }

        .send-btn {
            width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            background: var(--accent); color: var(--on-accent); border: none; cursor: pointer;
            opacity: 0; transform: scale(.6); pointer-events: none;
            transition: opacity .2s, transform .2s, background .2s, box-shadow .2s;
        }
        .send-btn.visible { opacity: 1; transform: scale(1); pointer-events: auto; }
        .send-btn:hover:not(:disabled) { background: var(--accent-hover); box-shadow: 0 4px 14px rgba(15,81,50,.35); }
        .send-btn:active:not(:disabled) { transform: scale(.92); }
        .send-btn:disabled { opacity: .45; cursor: not-allowed; }
        .send-btn svg { width: 18px; height: 18px; transform: scaleX(-1); }

        .input-tools { display: flex; flex-wrap: wrap; gap: .4rem; padding: .35rem .2rem .1rem; }
        .input-tools:empty { display: none; padding: 0; }
        .tool-btn {
            display: inline-flex; align-items: center; gap: .35rem;
            padding: .3rem .7rem; border-radius: 999px; font-size: .78rem; font-weight: 500; cursor: pointer;
            background: var(--accent-soft); color: var(--accent); border: 1px solid var(--border);
            transition: background .2s;
        }
        .tool-btn:hover { background: var(--green-100); }
        .tool-btn svg { width: 14px; height: 14px; }
        .tool-btn .tool-x { font-size: .95rem; line-height: 1; opacity: .6; }

        /* ========== Settings ========== */
        .settings-overlay {
            display: none; position: fixed; inset: 0; background: rgba(10,25,18,0.45); backdrop-filter: blur(3px);
            z-index: 20000; justify-content: flex-start; align-items: stretch;
        }
        .settings-overlay.active { display: flex; }
        .settings-panel {
            width: 380px; max-width: 100%; height: 100%; background: var(--bg-card);
            box-shadow: var(--shadow-lg); display: flex; flex-direction: column; animation: slideIn .25s ease;
        }
        @keyframes slideIn { from { transform: translateX(-30px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        .settings-header { display: flex; align-items: center; justify-content: space-between; padding: 1.2rem 1.3rem; border-bottom: 1px solid var(--border); }
        .settings-header h2 { font-size: 1.1rem; font-weight: 700; }
        .settings-close {
            width: 36px; height: 36px; border-radius: 10px; background: transparent; border: none;
            color: var(--text-secondary); cursor: pointer; font-size: 1rem; transition: background .2s;
        }
        .settings-close:hover { background: var(--bg-secondary); }
        .settings-body { padding: 1.2rem 1.3rem; overflow-y: auto; display: flex; flex-direction: column; gap: 1.5rem; }
        .settings-group-label { font-size: .82rem; font-weight: 600; color: var(--text-secondary); margin-bottom: .6rem; }
        .font-size-options, .theme-options { display: flex; gap: .5rem; }
        .font-size-btn, .theme-btn {
            flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .25rem;
            padding: .7rem .3rem; background: var(--bg-card); color: var(--text-primary);
            border: 1px solid var(--border-strong); border-radius: 12px; cursor: pointer; font-size: .85rem;
            transition: background .2s, border-color .2s, color .2s;
        }
        .font-size-btn:hover, .theme-btn:hover { background: var(--bg-secondary); }
        .font-size-btn.active, .theme-btn.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
        .font-size-btn .fsize-label { font-size: .7rem; color: var(--text-tertiary); }
        .theme-btn .theme-icon { font-size: 1.2rem; }
        .delete-period-options { display: flex; flex-direction: column; gap: .5rem; }
        .delete-period-btn {
            display: flex; align-items: center; justify-content: space-between; gap: .5rem;
            padding: .75rem .9rem; background: var(--bg-card); color: var(--text-primary);
            border: 1px solid var(--border-strong); border-radius: 12px; font-size: .86rem; cursor: pointer; text-align: right;
            transition: background .2s, border-color .2s;
        }
        .delete-period-btn:hover { background: var(--bg-secondary); }
        .delete-period-btn .del-badge { background: var(--bg-secondary); color: var(--text-secondary); padding: .15rem .6rem; border-radius: 999px; font-size: .72rem; white-space: nowrap; }
        .delete-period-btn.danger { border-color: #f0b8b3; color: #b42318; }
        .delete-period-btn.danger:hover { background: #fdecea; }

        /* ========== Responsive ========== */
        @media (max-width: 1024px) {
            :root { --sidebar-width: 270px; }
            .chat-container { padding: 1rem .8rem 0; }
        }
        @media (max-width: 768px) {
            .header { display: flex; }
            .sidebar { transform: translateX(100%); width: min(300px, 85vw); box-shadow: none; }
            .sidebar.active { transform: translateX(0); box-shadow: var(--shadow-lg); }
            .main-container { margin-right: 0; }
            .chat-container { padding: .6rem .6rem 0; }
            .messages-area { gap: 1rem; }
            .message-content { max-width: 86%; padding: .75rem .95rem; }
            .message-avatar { width: 32px; height: 32px; }
            .input-area { padding: .3rem .6rem .8rem; }
            .typing-indicator { padding: .3rem .8rem; }
            .message-actions { opacity: 1; }
            .welcome-basmala { font-size: 1.55rem; }
            .welcome-title { font-size: 1.3rem; }
            .settings-panel { width: 100%; }
        }
        @media (max-width: 480px) {
            .welcome-features, .prompt-cards { grid-template-columns: 1fr; }
            .message-content { max-width: 88%; }
            .message-avatar { display: none; }
        }
        @media (max-height: 600px) {
            .welcome-logo { display: none; }
            .input-area { padding-bottom: .4rem; }
        }
    
        /* ===== v2: UX enhancements ===== */
        .chat-container { position: relative; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .sidebar-overlay { animation: fadeIn .25s ease; }
        .settings-overlay.active, .confirm-overlay.active { animation: fadeIn .2s ease; }
        .message-actions { flex-wrap: wrap; }
        .action-btn.speaking { background: var(--accent-soft); color: var(--accent); }

        .scroll-bottom-btn {
            position: absolute; left: 50%; bottom: 14px;
            transform: translate(-50%, 12px) scale(.9); opacity: 0; pointer-events: none;
            width: 40px; height: 40px; border-radius: 50%;
            border: 1px solid var(--border); background: var(--bg-card); color: var(--accent);
            box-shadow: var(--shadow-lg); display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: opacity .2s, transform .2s; z-index: 20;
        }
        .scroll-bottom-btn.visible { opacity: 1; transform: translate(-50%, 0) scale(1); pointer-events: auto; }
        .scroll-bottom-btn svg { width: 20px; height: 20px; }
        .scroll-bottom-btn:hover { background: var(--accent-soft); }

        .followups { width: 100%; max-width: 820px; margin: 0 auto; padding: 0 .2rem; animation: fadeUp .35s ease; }
        .followups-label { font-size: .75rem; color: var(--text-tertiary); margin-bottom: .4rem; font-weight: 500; }
        .followups-list { display: flex; flex-wrap: wrap; gap: .45rem; }
        .followup-chip {
            padding: .5rem .85rem; border-radius: 999px; border: 1px solid var(--border-strong);
            background: var(--bg-card); color: var(--text-primary); font-size: .85rem; cursor: pointer;
            transition: background .2s, border-color .2s, color .2s;
        }
        .followup-chip:hover { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }

        .src-badges { display: flex; flex-wrap: wrap; gap: .45rem; margin-top: .8rem; padding-top: .7rem; border-top: 1px dashed var(--border-strong); }
        .src-badge {
            display: inline-flex; align-items: center; gap: .5rem; padding: .3rem .75rem .3rem .3rem;
            border-radius: 12px; background: var(--bg-secondary); border: 1px solid var(--border);
            font-size: .8rem; color: var(--text-secondary);
        }
        .src-badge b { color: var(--text-primary); font-weight: 600; }
        .src-ico { width: 26px; height: 26px; border-radius: 8px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .src-ico svg { width: 15px; height: 15px; }
        .src-badge.quran .src-ico { background: var(--green-100); color: var(--green-800); }
        .src-badge.fatwa .src-ico { background: var(--gold-soft); color: #8a6d2f; }
        [data-theme="dark"] .src-badge.quran .src-ico { background: rgba(82,183,136,.18); color: #95d5b2; }
        [data-theme="dark"] .src-badge.fatwa .src-ico { background: rgba(184,147,74,.18); color: #e0c27a; }

        .sidebar-search { position: relative; margin: 0 0 .5rem; }
        .sidebar-search input {
            width: 100%; padding: .55rem 2.1rem .55rem .8rem; border-radius: 10px;
            border: 1px solid var(--border); background: var(--bg-secondary); color: var(--text-primary);
            font: inherit; font-size: .85rem; outline: none; transition: border-color .2s, box-shadow .2s;
        }
        .sidebar-search input:focus { border-color: var(--green-600); box-shadow: 0 0 0 3px rgba(64,145,108,.15); }
        .sidebar-search svg { position: absolute; right: .7rem; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--text-tertiary); pointer-events: none; }
        .tag-filter { display: flex; flex-wrap: wrap; gap: .35rem; margin: 0 0 .5rem; }
        .tag-filter:empty { display: none; }
        .tag-chip {
            padding: .25rem .6rem; border-radius: 999px; font-size: .74rem; cursor: pointer;
            border: 1px solid var(--border-strong); background: transparent; color: var(--text-secondary);
        }
        .tag-chip.active { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }

        .conversation-item { display: flex; align-items: center; gap: .45rem; }
        .conversation-item.pinned { background: rgba(184,147,74,.07); }
        .ci-pin-dot { color: var(--gold); display: flex; flex-shrink: 0; }
        .ci-pin-dot svg { width: 13px; height: 13px; }
        .ci-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: .15rem; }
        .ci-title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .ci-tag { align-self: flex-start; font-size: .68rem; padding: .05rem .45rem; border-radius: 999px; background: var(--bg-secondary); color: var(--text-tertiary); }
        .ci-actions { display: flex; gap: 2px; opacity: .45; transition: opacity .2s; flex-shrink: 0; }
        .conversation-item:hover .ci-actions, .conversation-item.active .ci-actions { opacity: 1; }
        .ci-btn {
            width: 26px; height: 26px; border-radius: 8px; border: none; background: transparent;
            color: var(--text-tertiary); display: flex; align-items: center; justify-content: center; cursor: pointer;
        }
        .ci-btn:hover { background: var(--bg-card); color: var(--accent); }
        .ci-btn.on { color: var(--gold); }
        .ci-btn svg { width: 14px; height: 14px; }
        .conv-empty { padding: 1rem; text-align: center; color: var(--text-tertiary); font-size: .85rem; }

        .export-options { display: flex; gap: .5rem; }
        .export-btn {
            flex: 1; padding: .7rem .4rem; border-radius: 12px; cursor: pointer; font-size: .86rem;
            background: var(--bg-card); color: var(--text-primary); border: 1px solid var(--border-strong);
            transition: background .2s, border-color .2s, color .2s;
        }
        .export-btn:hover { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }

        .toast {
            position: fixed; left: calc(50% - var(--sidebar-width) / 2); bottom: 7.5rem;
            transform: translate(-50%, 12px); opacity: 0; pointer-events: none;
            background: var(--text-primary); color: var(--bg-card); padding: .6rem 1rem; border-radius: 12px;
            font-size: .86rem; box-shadow: var(--shadow-lg); text-align: center; max-width: 90vw;
            transition: opacity .25s, transform .25s; z-index: 30000;
        }
        .toast.show { opacity: 1; transform: translate(-50%, 0); }
        @media (max-width: 768px) { .toast { left: 50%; bottom: 6.5rem; } }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
        }
        
        /* ===== v3: mobile hardening & polish ===== */
        button, .conversation-item, .prompt-card { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
        .messages-area, .conversation-list, .settings-body, .tag-presets { overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }

        /* Safe areas (notch / home indicator) */
        .sidebar { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
        .settings-panel { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
        .header { padding-top: calc(.4rem + env(safe-area-inset-top, 0px)); min-height: calc(60px + env(safe-area-inset-top, 0px)); }
        .input-area { padding-bottom: calc(1.3rem + env(safe-area-inset-bottom, 0px)); }
        @media (max-width: 768px) {
            .main-container { padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
            .input-area { padding-bottom: calc(.8rem + env(safe-area-inset-bottom, 0px)); }
            .sidebar-search input, .tag-input { font-size: 16px; }
            .followups { padding: 0 .1rem; }
        }
        @media (max-height: 600px) {
            .input-area { padding-bottom: calc(.4rem + env(safe-area-inset-bottom, 0px)); }
        }

        /* Touch screens: bigger targets, always-visible controls, no iOS focus-zoom */
        @media (hover: none) and (pointer: coarse) {
            .message-actions { opacity: 1; }
            .action-btn { width: 40px; height: 40px; }
            .action-btn svg { width: 18px; height: 18px; }
            .ci-actions { opacity: 1; }
            .ci-btn { width: 36px; height: 36px; }
            .ci-btn svg { width: 16px; height: 16px; }
            .conversation-item { padding: .7rem .75rem; }
            .tag-chip { padding: .4rem .8rem; font-size: .8rem; }
            .followup-chip { min-height: 42px; }
            .footer-btn, .new-chat-btn { min-height: 44px; }
            .settings-close { width: 44px; height: 44px; }
            .sidebar-search input, .tag-input { font-size: 16px; }
        }

        /* Micro-interactions */
        .followup-chip { max-width: 100%; text-align: right; line-height: 1.5; animation: fadeUp .35s ease both; }
        .followup-chip:nth-child(2) { animation-delay: .07s; }
        .followup-chip:nth-child(3) { animation-delay: .14s; }
        .src-badge { animation: fadeIn .45s ease; }
        .confirm-box { animation: popIn .22s ease; }
        .action-btn:active, .followup-chip:active, .export-btn:active, .prompt-card:active,
        .tag-chip:active, .ci-btn:active, .new-chat-btn:active, .footer-btn:active { transform: scale(.95); }

        /* Tag dialog (replaces prompt()) */
        .tag-box { text-align: right; }
        .tag-box .confirm-title { text-align: center; }
        .tag-input {
            width: 100%; padding: .7rem .9rem; border-radius: 12px; margin-bottom: .8rem;
            border: 1px solid var(--border-strong); background: var(--bg-secondary); color: var(--text-primary);
            font: inherit; font-size: 1rem; outline: none; transition: border-color .2s, box-shadow .2s;
        }
        .tag-input:focus { border-color: var(--green-600); box-shadow: 0 0 0 3px rgba(64,145,108,.15); }
        .tag-presets { display: flex; flex-wrap: wrap; gap: .4rem; margin-bottom: 1.1rem; max-height: 28vh; overflow-y: auto; }
        .tag-box .confirm-btns { flex-wrap: wrap; }
        .tag-box .confirm-btns button { min-width: 30%; }
        .tag-save {
            flex: 1; padding: .7rem; border-radius: 10px; font-size: .92rem; font-weight: 600; cursor: pointer;
            background: var(--accent); color: var(--on-accent); border: none; transition: background .2s, box-shadow .2s;
        }
        .tag-save:hover { background: var(--accent-hover); }

    <script>
        // ── Visual Viewport fix for mobile keyboard ──────────────────────
        // Prevents input box from being hidden behind the virtual keyboard
        function applyViewportHeight() {
            const vh = window.visualViewport ? window.visualViewport.height : window.innerHeight;
            document.querySelector('.main-container').style.height = vh + 'px';
        }
        if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', applyViewportHeight);
            window.visualViewport.addEventListener('scroll', applyViewportHeight);
        }
        window.addEventListener('resize', applyViewportHeight);
        applyViewportHeight();
        // ─────────────────────────────────────────────────────────────────
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const messagesArea = document.getElementById('messagesArea');
        const typingIndicator = document.getElementById('typingIndicator');
        const newChatBtn = document.getElementById('newChatBtn');
        const conversationList = document.getElementById('conversationList');
        const userSection = document.getElementById('userSection');
        const logoutBtn = document.getElementById('logoutBtn');
        const inputTools = document.getElementById('inputTools');
        const hamburgerBtn = document.getElementById('hamburgerBtn');
        const sidebar = document.getElementById('sidebar');
        const sidebarOverlay = document.getElementById('sidebarOverlay');

        function toggleSidebar() {
            if (!sidebar) return;
            sidebar.classList.toggle('active');
            if (sidebarOverlay) {
                sidebarOverlay.style.display = sidebar.classList.contains('active') ? 'block' : 'none';
            }
        }

        if (hamburgerBtn) hamburgerBtn.addEventListener('click', toggleSidebar);
        if (sidebarOverlay) sidebarOverlay.addEventListener('click', toggleSidebar);

        const WORKER_URL = '/api/chat';
        let chatHistory = [];
        let isProcessing = false;
        let currentChatId = null;
        let allChats = [];
        let selectedOptions = new Set();

        // تعديل حجم textarea تلقائياً
        messageInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 100) + 'px';
        });

        // إرسال بالضغط على Enter
        messageInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        // زر الإرسال
        sendBtn.addEventListener('click', sendMessage);

        // محادثة جديدة
        newChatBtn.addEventListener('click', startNewChat);
        newChatBtn.addEventListener('click', () => { if (window.innerWidth <= 768) openSidebarMobile(false); });

        // ── قائمة الأدوات (Input Tools) ──────────────────────────────────
        const optionsToggle   = document.getElementById('optionsToggle');
        const optionsMenu     = document.getElementById('optionsMenu');
        const deepSearchOption = document.getElementById('deepSearchOption');
        const deepThinkOption  = document.getElementById('deepThinkOption');

        const TOOL_META = {
            'deep-search': { label: 'بحث معمّق', el: deepSearchOption },
            'deep-think':  { label: 'تفكير عميق', el: deepThinkOption }
        };

        function setMenuOpen(open) {
            if (!optionsMenu || !optionsToggle) return;
            optionsMenu.classList.toggle('active', open);
            optionsToggle.classList.toggle('open', open);
            optionsToggle.setAttribute('aria-expanded', String(open));
        }

        function toggleOption(key) {
            if (selectedOptions.has(key)) selectedOptions.delete(key);
            else selectedOptions.add(key);
            updateToolsDisplay();
        }

        if (optionsToggle) {
            optionsToggle.addEventListener('click', function(e) {
                e.stopPropagation();
                setMenuOpen(!optionsMenu.classList.contains('active'));
            });
        }
        // إغلاق القائمة عند الضغط خارجها أو بزر Escape
        document.addEventListener('click', function(e) {
            if (!e.target.closest('#optionsMenu') && !e.target.closest('#optionsToggle')) setMenuOpen(false);
        });
        document.addEventListener('keydown', function(e) { if (e.key === 'Escape') setMenuOpen(false); });

        Object.entries(TOOL_META).forEach(([key, meta]) => {
            if (meta.el) meta.el.addEventListener('click', function(e) {
                e.stopPropagation();
                toggleOption(key);
            });
        });

        // تحديث عرض الأدوات المختارة (شارات فوق صندوق الإدخال + حالة القائمة)
        function updateToolsDisplay() {
            if (!inputTools) return;
            inputTools.innerHTML = '';
            Object.entries(TOOL_META).forEach(([key, meta]) => {
                const on = selectedOptions.has(key);
                if (meta.el) meta.el.classList.toggle('active', on);
                if (!on) return;
                const chip = document.createElement('button');
                chip.type = 'button';
                chip.className = 'tool-btn active';
                chip.title = 'إلغاء ' + meta.label;
                chip.innerHTML = meta.el.querySelector('svg').outerHTML + '<span>' + meta.label + '</span><span class="tool-x">×</span>';
                chip.addEventListener('click', () => toggleOption(key));
                inputTools.appendChild(chip);
            });
        }

        // زر الإرسال يظهر ديناميكياً عند الكتابة
        function refreshSendVisibility() {
            sendBtn.classList.toggle('visible', messageInput.value.trim().length > 0);
        }
        messageInput.addEventListener('input', refreshSendVisibility);
        refreshSendVisibility();

        // ── شاشة الترحيب ────────────────────────────────────────────────
        const PROMPT_SUGGESTIONS = [
            { icon: '🌙', text: 'ما هي أحكام الصيام؟' },
            { icon: '📖', text: 'فسّر لي آية الكرسي' },
            { icon: '🕌', text: 'كيف أؤدي صلاة الاستخارة؟' },
            { icon: '🤲', text: 'ما هي شروط قبول الدعاء؟' }
        ];

        function renderWelcome() {
            const logoSrc = document.querySelector('.sidebar-logo img')?.src || '';
            messagesArea.innerHTML = `
                <div class="welcome-section">
                    ${logoSrc ? `<img class="welcome-logo" src="${logoSrc}" alt="">` : ''}
                    <div class="welcome-basmala">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>
                    <div>
                        <div class="welcome-title">كيف يمكنني مساعدتك؟</div>
                        <div class="welcome-subtitle">اسأل عن أي موضوع إسلامي من القرآن والسنة ونجيبك من المصادر المعتمدة في الإسلام</div>
                    </div>
                    <div class="prompt-cards">
                        ${PROMPT_SUGGESTIONS.map(p => `
                            <button type="button" class="prompt-card" data-q="${p.text}">
                                <span class="pc-icon">${p.icon}</span><span>${p.text}</span>
                            </button>`).join('')}
                    </div>
                </div>`;
        }
        messagesArea.addEventListener('click', function(e) {
            const card = e.target.closest('.prompt-card');
            if (card) window.askQuestion(card.dataset.q);
        });

        async function sendMessage() {
            const text = messageInput.value.trim();
            if (!text || isProcessing) return;
            clearFollowups();

            if (!currentChatId) {
                startNewChat();
            }

            isProcessing = true;
            sendBtn.disabled = true;

            addMessage(text, 'user');
            chatHistory.push({ role: 'user', content: text });

            messageInput.value = '';
            messageInput.style.height = 'auto';
            refreshSendVisibility();

            typingIndicator.classList.add('active');
            messagesArea.scrollTop = messagesArea.scrollHeight;

            try {
                const response = await fetch(WORKER_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: text,
                        chatHistory: apiHistory(),
                        options: Array.from(selectedOptions)
                    })
                });

                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);

                const data = await response.json();

                if (data.content) {
                    addMessage(data.content, 'assistant', data.sources, text);
                    showFollowups(data.followups || suggestFollowups(data.content, text));
                    chatHistory.push({ role: 'assistant', content: data.content, sources: data.sources || null, uq: text });
                    saveChat();
                } else {
                    addMessage('عذراً، لم أتمكن من العثور على إجابة.', 'assistant', null, text);
                }

            } catch (error) {
                console.error('❌ خطأ:', error);
                let errorMessage = "⚠️ حدث خطأ في الاتصال بالخادم. يرجى المحاولة مرة أخرى.";
                if (error.message.includes('Failed to fetch')) {
                    errorMessage = "🔌 لا يمكن الاتصال بالخادم. تأكد من أن الـ Worker منشور.";
                }
                addMessage(errorMessage, 'assistant', null, text);
            } finally {
                typingIndicator.classList.remove('active');
                isProcessing = false;
                sendBtn.disabled = false;
                focusInput();
            }
        }

                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 10v12"/><path d="M15 5.88 14 10h5.83a2 2 0 0 1 1.92 2.56l-2.33 8A2 2 0 0 1 17.5 22H4a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h2.76a2 2 0 0 0 1.79-1.11L12 2a3.13 3.13 0 0 1 3 3.88Z"/></svg>
                    </button>
                    <button class="action-btn btn-dislike" title="عدم إعجاب" onclick="dislikeMsg(this)">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 14V2"/><path d="M9 18.12 10 14H4.17a2 2 0 0 1-1.92-2.56l2.33-8A2 2 0 0 1 6.5 2H20a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-2.76a2 2 0 0 0-1.79 1.11L12 22a3.13 3.13 0 0 1-3-3.88Z"/></svg>
                    </button>
                    <button class="action-btn btn-regen" title="إعادة التوليد" onclick="regenMsg(this)">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
                    </button>
                    <button class="action-btn btn-speak" title="استماع" onclick="speakMsg(this)">${ICONS.speak}</button>
                    <button class="action-btn btn-share" title="مشاركة" onclick="shareMsg(this)">${ICONS.share}</button>
                </div>
            ` : '';

            let messageHTML = `
                <div class="message-avatar">${avatarContent}</div>
                <div class="message-content">
                    ${formatContent(content)}
                    ${sources ? formatSources(sources) : ''}
                    ${actionsHTML}
                </div>
            `;
            messageDiv.innerHTML = messageHTML;
            if (userQuestion) messageDiv.dataset.uq = userQuestion;
            messagesArea.appendChild(messageDiv);
            messagesArea.scrollTop = messagesArea.scrollHeight;
        }

        function copyMsg(btn) {
            copyText(plainTextOf(btn)).then(() => {
                btn.classList.add('copied');
                showToast('تم النسخ');
                setTimeout(() => { btn.classList.remove('copied'); }, 2000);
            }).catch(() => showToast('تعذّر النسخ، حاول مرة أخرى'));
        }

        function likeMsg(btn) {
            btn.classList.toggle('active-like');
            btn.closest('.message-actions').querySelector('.btn-dislike').classList.remove('active-dislike');
        }

        function dislikeMsg(btn) {
            btn.classList.toggle('active-dislike');
            btn.closest('.message-actions').querySelector('.btn-like').classList.remove('active-like');
        }

        async function regenMsg(btn) {
            const msgDiv = btn.closest('.message.assistant');
            const question = msgDiv?.dataset?.uq;
            if (!question || isProcessing) return;
            clearFollowups();
            const allAsst = messagesArea.querySelectorAll('.message.assistant');
            const wasLast = allAsst.length > 0 && allAsst[allAsst.length - 1] === msgDiv;
            msgDiv.remove();
            isProcessing = true;
            sendBtn.disabled = true;
            typingIndicator.classList.add('active');
            messagesArea.scrollTop = messagesArea.scrollHeight;
            try {
                const response = await fetch(WORKER_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        message: question, 
                        chatHistory: apiHistory(),
                        options: Array.from(selectedOptions)
                    })
                });
                if (!response.ok) throw new Error();
                const data = await response.json();
                addMessage(data.content || 'عذراً، لم أتمكن من العثور على إجابة.', 'assistant', data.sources, question);
                if (data.content) showFollowups(data.followups || suggestFollowups(data.content, question));
                if (data.content) {
                    if (wasLast && chatHistory.length && chatHistory[chatHistory.length - 1].role === 'assistant') chatHistory.pop();
                    chatHistory.push({ role: 'assistant', content: data.content, sources: data.sources || null, uq: question });
                }
                saveChat();
            } catch {
                addMessage('⚠️ حدث خطأ في الاتصال.', 'assistant', null, question);
            } finally {
                typingIndicator.classList.remove('active');
                isProcessing = false;
                sendBtn.disabled = false;
            }
        }

        function formatContent(text) {
            if (!text) return '';
            text = text.replace(/</g, '&lt;').replace(/>/g, '&gt;');
            text = text.replace(/﴿(.*?)﴾/gsu, '<span class="quran-verse">﴿$1﴾</span>');
            text = text.replace(/«(.*?)»/gs, '<span class="quote-text">«$1»</span>');
            text = text.replace(/(النبي محمد|رسول الله|النبي ﷺ)/g, '$1 ﷺ');
            text = text.replace(/\n/g, '<br>');
            return text;
        }

        function formatSources(sources) {
            if (!sources) return '';
            const parts = [];
            if (sources.quran > 0) parts.push(`<span class="src-badge quran"><span class="src-ico">${ICONS.quran}</span><span><b>${sources.quran}</b> آية</span></span>`);
            if (sources.islamweb > 0) parts.push(`<span class="src-badge fatwa"><span class="src-ico">${ICONS.scroll}</span><span><b>${sources.islamweb}</b> فتوى</span></span>`);
            return parts.length ? `<div class="src-badges">${parts.join('')}</div>` : '';
        }

        function startNewChat() {
            currentChatId = Date.now() + Math.random();
            chatHistory = [];
            selectedOptions.clear();
            updateToolsDisplay();
            stopSpeaking();
            renderWelcome();
            focusInput();
        }

        function getChatKey(id) { return `chat_${window.currentUser?.uid || 'guest'}_${id}`; }

        function saveChat() {
            const key = getChatKey(currentChatId);
            let prev = {};
            try { prev = JSON.parse(localStorage.getItem(key)) || {}; } catch {}
            const firstMessage = chatHistory.find(m => m.role === 'user')?.content || 'محادثة جديدة';
            const chatData = {
                ...prev,
                id: currentChatId,
                title: firstMessage.substring(0, 50),
                history: chatHistory,
                timestamp: new Date().toISOString()
            };
            try { localStorage.setItem(key, JSON.stringify(chatData)); }
            catch (e) { showToast('تعذّر حفظ المحادثة (مساحة التخزين ممتلئة)'); }
            loadChats();
        }

        function loadChats() {
            const prefix = `chat_${window.currentUser?.uid || 'guest'}_`;
            allChats = [];
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key && key.startsWith(prefix)) {
                    try { const d = JSON.parse(localStorage.getItem(key)); if (d) allChats.push(d); } catch {}
                }
            }
            // المثبّتة أولاً، ثم الأحدث
            allChats.sort((a, b) => (!!b.pinned - !!a.pinned) || (new Date(b.timestamp) - new Date(a.timestamp)));
            renderConversations();
        }

        function updateChatMeta(id, patch) {
            const key = getChatKey(id);
            try {
                const d = JSON.parse(localStorage.getItem(key));
                if (d) { Object.assign(d, patch); localStorage.setItem(key, JSON.stringify(d)); }
            } catch {}
            loadChats();
        }

        function renderConversations() {
            const q = (document.getElementById('sidebarSearch')?.value || '').trim().toLowerCase();
            renderTagFilter();
            if (allChats.length === 0) {
                conversationList.innerHTML = '<div style="padding: 1rem; text-align: center; color: var(--text-tertiary); font-size: 0.85rem;">لا توجد محادثات</div>';
                return;
            }
            const list = allChats.filter(c => {
                if (activeTag && c.tag !== activeTag) return false;
                if (!q) return true;
                const hay = [c.title, c.tag || '', ...(c.history || []).map(m => m.content)].join(' ').toLowerCase();
                return hay.includes(q);
            });
            if (list.length === 0) {
                conversationList.innerHTML = '<div class="conv-empty">لا توجد نتائج مطابقة</div>';
                return;
            }
            conversationList.innerHTML = list.map(c => `
                <div class="conversation-item ${String(c.id) === String(currentChatId) ? 'active' : ''} ${c.pinned ? 'pinned' : ''}" data-id="${escHtml(c.id)}">
                    ${c.pinned ? `<span class="ci-pin-dot">${ICONS.pin}</span>` : ''}
                    <span class="ci-main">
                        <span class="ci-title">${escHtml(c.title)}</span>
                        ${c.tag ? `<span class="ci-tag">${escHtml(c.tag)}</span>` : ''}
                    </span>
                    <span class="ci-actions">
                        <button type="button" class="ci-btn ${c.pinned ? 'on' : ''}" data-act="pin" title="${c.pinned ? 'إلغاء التثبيت' : 'تثبيت'}">${ICONS.pin}</button>
                        <button type="button" class="ci-btn" data-act="tag" title="وسم">${ICONS.tag}</button>
                    </span>
                </div>`).join('');
        }

        function renderTagFilter() {
            const el = document.getElementById('tagFilter');
            if (!el) return;
            const tags = [...new Set(allChats.map(c => c.tag).filter(Boolean))];
            if (activeTag && !tags.includes(activeTag)) activeTag = '';
            el.innerHTML = tags.length
                ? [`<button type="button" class="tag-chip ${!activeTag ? 'active' : ''}" data-tag="">الكل</button>`,
                   ...tags.map(t => `<button type="button" class="tag-chip ${activeTag === t ? 'active' : ''}" data-tag="${escHtml(t)}">${escHtml(t)}</button>`)].join('')
                : '';
        }

        function loadChat(chatId) {
            const userId = window.currentUser?.uid || 'guest';
            const chatKey = `chat_${userId}_${chatId}`;
            const data = JSON.parse(localStorage.getItem(chatKey));
            if (data) {
                currentChatId = chatId;
                chatHistory = data.history;
                selectedOptions.clear();
                updateToolsDisplay();
                    messagesArea.innerHTML = '';
                stopSpeaking();
                let lastUserQ = null;
                chatHistory.forEach(msg => {
                    if (msg.role === 'user') { lastUserQ = msg.content; addMessage(msg.content, 'user'); }
                    else addMessage(msg.content, msg.role, msg.sources || null, msg.uq || lastUserQ);
                });
                renderConversations();
            }
        }

        window.askQuestion = function(question) {
            messageInput.value = question;
            focusInput();
            sendMessage();
        };

        // ── Delete all chats ──────────────────────────────────────────────
        const deleteAllBtn = document.getElementById('deleteAllBtn');
        const confirmOverlay = document.getElementById('confirmOverlay');
        const confirmYes = document.getElementById('confirmYes');
        const confirmNo = document.getElementById('confirmNo');

        deleteAllBtn.addEventListener('click', () => {
            confirmOverlay.classList.add('active');
        });

        confirmNo.addEventListener('click', () => {
            confirmOverlay.classList.remove('active');
        });

        confirmOverlay.addEventListener('click', (e) => {
            if (e.target === confirmOverlay) confirmOverlay.classList.remove('active');
        });

        confirmYes.addEventListener('click', () => {
            const userId = window.currentUser?.uid || 'guest';
            const prefix = `chat_${userId}_`;
            const keysToDelete = [];
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key && key.startsWith(prefix)) keysToDelete.push(key);
            }
            keysToDelete.forEach(k => localStorage.removeItem(k));
            allChats = [];
            renderConversations();
            confirmOverlay.classList.remove('active');
            startNewChat();
        });

        // ── SETTINGS PANEL ────────────────────────────────────────────────
        const settingsBtn       = document.getElementById('settingsBtn');
        const settingsOverlay   = document.getElementById('settingsOverlay');
        const settingsClose     = document.getElementById('settingsClose');

        function openSettings() { settingsOverlay.classList.add('active'); }
        function closeSettings() { settingsOverlay.classList.remove('active'); }

        settingsBtn.addEventListener('click', openSettings);
        settingsClose.addEventListener('click', closeSettings);
        settingsOverlay.addEventListener('click', (e) => {
            if (e.target === settingsOverlay) closeSettings();
        });

        // ── Font size ──────────────────────────────────────────────────────
        const savedFontSize = localStorage.getItem('askislam_fontsize') || '0.95rem';
        document.documentElement.style.setProperty('--chat-font-size', savedFontSize);

        document.querySelectorAll('.font-size-btn').forEach(btn => {
            if (btn.dataset.size === savedFontSize) btn.classList.add('active');
            else btn.classList.remove('active');

            btn.addEventListener('click', () => {
                document.querySelectorAll('.font-size-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                const size = btn.dataset.size;
                document.documentElement.style.setProperty('--chat-font-size', size);
                localStorage.setItem('askislam_fontsize', size);
            });
        });

        // ── Theme ─────────────────────────────────────────────────────────
        function applyTheme(theme) {
            const root = document.documentElement;
            if (theme === 'auto') {
                const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                root.setAttribute('data-theme', prefersDark ? 'dark' : 'light');
            } else {
                root.setAttribute('data-theme', theme);
            }
        }

        const savedTheme = localStorage.getItem('askislam_theme') || 'light';
        applyTheme(savedTheme);

        document.querySelectorAll('.theme-btn').forEach(btn => {
            if (btn.dataset.theme === savedTheme) btn.classList.add('active');
            else btn.classList.remove('active');

            btn.addEventListener('click', () => {
                document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                const theme = btn.dataset.theme;
                localStorage.setItem('askislam_theme', theme);
                applyTheme(theme);
            });
        });

        // Auto theme: listen for system changes
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
            if (localStorage.getItem('askislam_theme') === 'auto') applyTheme('auto');
        });

        // ── Delete old chats ───────────────────────────────────────────────
        document.querySelectorAll('.delete-period-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const days = parseInt(btn.dataset.days);
                const userId = window.currentUser?.uid || 'guest';
                const prefix = `chat_${userId}_`;
                const cutoff = days === 0 ? Infinity : Date.now() - days * 86400000;
                const keysToDelete = [];

                for (let i = 0; i < localStorage.length; i++) {
                    const key = localStorage.key(i);
                    if (!key || !key.startsWith(prefix)) continue;
                    if (days === 0) {
                        keysToDelete.push(key);
                    } else {
                        try {
                            const data = JSON.parse(localStorage.getItem(key));
                            const ts = data?.timestamp ? new Date(data.timestamp).getTime() : 0;
                            if (ts < Date.now() - days * 86400000) keysToDelete.push(key);
                        } catch {}
                    }
                }

                if (keysToDelete.length === 0) {
                    alert('لا توجد محادثات تستوفي هذا الشرط.');
                    return;
                }

                const label = days === 0 ? 'جميع المحادثات' : 'المحادثات الأقدم من ' + days + ' يوم';
                if (!confirm('سيتم حذف ' + label + ' (' + keysToDelete.length + ' محادثة). هل أنت متأكد؟')) return;

                keysToDelete.forEach(k => localStorage.removeItem(k));
                allChats = [];
                renderConversations();
                startNewChat();
                closeSettings();
            });
        });
        // ─────────────────────────────────────────────────────────────────


        // ══════════════════════════════════════════════════════════════════
        // ميزات v2: أيقونات، استماع، مشاركة، تصدير، أسئلة مقترحة، وسوم، اختصارات
        // ══════════════════════════════════════════════════════════════════
        const ICONS = {
            quran: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4h6a4 4 0 0 1 4 4v12a3 3 0 0 0-3-3H2z"/><path d="M22 4h-6a4 4 0 0 0-4 4v12a3 3 0 0 1 3-3h7z"/></svg>',
            scroll: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h10a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v2"/><path d="M4 9h4v10a2 2 0 0 1-4 0z"/><path d="M12 8h5M12 12h5"/></svg>',
            speak: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg>',
            stop: '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>',
            share: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg>',
            pin: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17v5"/><path d="M9 3h6l-1 6 3 3H7l3-3-1-6z"/></svg>',
            tag: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6 13.4l-7.2 7.2a2 2 0 0 1-2.8 0L2 12V2h10l8.6 8.6a2 2 0 0 1 0 2.8z"/><circle cx="7" cy="7" r="1.5"/></svg>'
        };

        function escHtml(v) {
            return String(v ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            if (!t) return;
            t.textContent = msg;
            t.classList.add('show');
            clearTimeout(showToast._t);
            showToast._t = setTimeout(() => t.classList.remove('show'), 2000);
        }

        function downloadBlob(blob, name) {
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = name;
            document.body.appendChild(a);
            a.click();
            setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
        }

        function plainTextOf(btn) {
            const clone = btn.closest('.message-content').cloneNode(true);
            clone.querySelectorAll('.message-actions, .src-badges, .sources-bar, .followups').forEach(n => n.remove());
            clone.querySelectorAll('br').forEach(br => br.replaceWith('\n'));
            return clone.textContent.trim();
        }

        // ── الاستماع للإجابة (يُقسَّم النص لتفادي انقطاع الصوت على الجوال) ──
        let speakingBtn = null;
        let speakSession = 0;
        function chunkForSpeech(text, max) {
            max = max || 170;
            const pieces = text.replace(/[ \t]+/g, ' ').match(/[^.!؟?،؛:\n]+[.!؟?،؛:\n]*/g) || [text];
            const out = [];
            let cur = '';
            const push = t => { t = t.trim(); if (t) out.push(t); };
            pieces.forEach(p => {
                if (p.length > max) {
                    push(cur); cur = '';
                    let buf = '';
                    p.split(' ').forEach(w => {
                        if ((buf + ' ' + w).length > max) { push(buf); buf = w; }
                        else buf = buf ? buf + ' ' + w : w;
                    });
                    push(buf);
                } else if ((cur + p).length > max) { push(cur); cur = p; }
                else cur += p;
            });
            push(cur);
            return out;
        }
        function resetSpeakBtn(b) { b.innerHTML = ICONS.speak; b.title = 'استماع'; b.classList.remove('speaking'); }
        function stopSpeaking() {
            speakSession++;
            if ('speechSynthesis' in window) { try { speechSynthesis.cancel(); } catch (e) {} }
            if (speakingBtn) { resetSpeakBtn(speakingBtn); speakingBtn = null; }
        }
        function speakMsg(btn) {
            if (!('speechSynthesis' in window) || !('SpeechSynthesisUtterance' in window)) {
                showToast('الاستماع غير مدعوم في هذا المتصفح');
                return;
            }
            if (speakingBtn === btn) { stopSpeaking(); return; }
            stopSpeaking();
            const chunks = chunkForSpeech(plainTextOf(btn));
            if (!chunks.length) return;
            const session = speakSession;
            const voice = speechSynthesis.getVoices().find(v => v.lang && v.lang.toLowerCase().startsWith('ar'));
            btn.innerHTML = ICONS.stop;
            btn.title = 'إيقاف';
            btn.classList.add('speaking');
            speakingBtn = btn;
            let i = 0;
            const next = () => {
                if (session !== speakSession) return;
                if (i >= chunks.length) { stopSpeaking(); return; }
                const u = new SpeechSynthesisUtterance(chunks[i++]);
                u.lang = 'ar-SA';
                u.rate = 0.92;
                if (voice) u.voice = voice;
                u.onend = next;
                u.onerror = () => { if (session === speakSession) stopSpeaking(); };
                speechSynthesis.speak(u);
            };
            next();
        }
        window.addEventListener('pagehide', stopSpeaking);

        // ── مشاركة الإجابة (مشاركة أصلية أو نسخ مع الرابط) ──
        async function shareMsg(btn) {
            const text = plainTextOf(btn);
            const site = /^https?:/.test(location.protocol) ? location.origin : '';
            const body = `${text}\n\n— اسأل الإسلام${site ? '\n' + site : ''}`;
            if (navigator.share) {
                try { await navigator.share({ title: 'اسأل الإسلام', text: body }); return; }
                catch (err) { if (err && err.name === 'AbortError') return; }
            }
            try {
                await copyText(body);
                showToast(site ? 'تم نسخ الإجابة مع رابط الموقع' : 'تم نسخ الإجابة');
            } catch {
                showToast('تعذّر النسخ، حاول مرة أخرى');
            }
        }

        // ── تصدير المحادثة الحالية ──
        function exportChat(format) {
            if (!chatHistory.length) { showToast('لا توجد محادثة لتصديرها'); return; }
            const stamp = new Date();
            const fileStamp = stamp.toISOString().slice(0, 10);
            const label = m => (m.role === 'user' ? 'السؤال' : 'الإجابة');
            const title = (chatHistory.find(m => m.role === 'user')?.content || 'محادثة').substring(0, 60);

            if (format === 'txt') {
                const lines = [
                    'اسأل الإسلام — ' + title,
                    'التاريخ: ' + stamp.toLocaleString('ar'),
                    ''
                ];
                chatHistory.forEach(m => { lines.push('[' + label(m) + ']', m.content, ''); });
                const blob = new Blob(['\uFEFF' + lines.join('\n')], { type: 'text/plain;charset=utf-8' });
                downloadBlob(blob, `askislam-${fileStamp}.txt`);
                showToast('تم تنزيل الملف النصي');
                return;
            }

            // PDF: نافذة طباعة منسّقة، ويختار المستخدم "حفظ كـ PDF"
            const body = chatHistory.map(m =>
                `<section class="${m.role}"><h4>${label(m)}</h4><p>${escHtml(m.content).replace(/\n/g, '<br>')}</p></section>`
            ).join('');
            const html = `<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>${escHtml(title)}</title>
<style>
